# Production virtual host. Certbot adds and maintains the matching :443 host.
<VirtualHost *:80>
    ServerName mahadum360.com
    ServerAlias www.mahadum360.com
    DocumentRoot /var/www/mahadum/public

    <Directory /var/www/mahadum/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # 310 MiB request envelope permits a 300 MiB multipart file plus metadata.
        LimitRequestBody 325058560
    </Directory>

    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    ErrorLog ${APACHE_LOG_DIR}/mahadum-error.log
    CustomLog ${APACHE_LOG_DIR}/mahadum-access.log combined
</VirtualHost>
